<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Fond Squircle Blanc Pur avec Bordure Subtile -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2" />

  <!-- Monogramme Géométrique NW Officiel -->
  <g transform="translate(10, 22) scale(0.46)">
    <!-- Branche N Gauche (Violet) -->
    <polygon points="10,140 40,140 85,25 55,25" fill="#281450" />
    <!-- Ruban N Diagonal (Émeraude) -->
    <polygon points="55,25 85,25 130,140 100,140" fill="#0A9678" />
    <polygon points="100,140 130,140 175,25 145,25" fill="#0A9678" />
    <!-- Interlock N/W (Violet) -->
    <polygon points="115,25 145,25 100,140 70,140" fill="#281450" />
    <!-- Branche W Droite V (Émeraude) -->
    <polygon points="140,65 165,130 190,65 172,65 165,95 152,65" fill="#0A9678" />
    <!-- Branche W Externe (Violet) -->
    <polygon points="145,25 175,25 220,140 190,140" fill="#281450" />
  </g>
</svg>
